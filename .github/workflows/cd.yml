name: CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Empacotar aplicação
        run: |
          mkdir -p dist
          zip -r dist/app-package.zip app requirements.txt README.md

      - name: Publicar artefato
        uses: actions/upload-artifact@v7
        with:
          name: app-package
          path: dist/app-package.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Simular preparação para deploy
        run: echo "Pacote pronto para ser implantado manualmente. Aguardando aprovação humana."

  docker-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar QEMU
        uses: docker/setup-qemu-action@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: rfsv10/as-devops-works:latest
name: CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Empacotar aplicação
        run: |
          mkdir -p dist
          zip -r dist/app-package.zip app requirements.txt README.md

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: dist/app-package.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Simular preparação para deploy
        run: echo "Pacote pronto para ser implantado manualmente. Aguardando aprovação humana."